<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 900" width="980" height="900" role="img" aria-label="tt-tnt serving and training stack"><title>tt-tnt serving and training stack</title><rect width="980" height="900" fill="#F1F8F8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A5452"/></marker></defs><text x="40" y="46" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="26" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">the stack, bottom to top</text><text x="40" y="70" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="13" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">who owns which part, and where our own code sits in it</text><rect x="40" y="96" width="900" height="78" rx="6" fill="#C7D9D8" fill-opacity="0.35" stroke="#C7D9D8" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="40" y="96" width="7" height="78" rx="3" fill="#C7D9D8"/><text x="62" y="118" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">tt-inference-server</text><text x="62" y="135" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">PRESENT ON THIS BOX, NOT IN OUR PATH — we serve through vLLM directly</text><text x="74" y="154" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· deployment / model catalogue</text><text x="74" y="171" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· not referenced by any manifest here</text><rect x="40" y="183" width="900" height="95" rx="6" fill="#8A6FB0" fill-opacity="0.1" stroke="#8A6FB0" stroke-width="1.5"/><rect x="40" y="183" width="7" height="95" rx="3" fill="#8A6FB0"/><text x="62" y="205" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">vLLM core</text><text x="62" y="222" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">OpenAI-compatible server and engine</text><text x="74" y="241" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· api_server</text><text x="74" y="258" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· engine core</text><text x="74" y="275" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· scheduler front half</text><rect x="40" y="287" width="900" height="112" rx="6" fill="#FA512E" fill-opacity="0.1" stroke="#FA512E" stroke-width="1.5"/><rect x="40" y="287" width="7" height="112" rx="3" fill="#FA512E"/><text x="62" y="309" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">vllm-tt-plugin  @c127c17</text><text x="62" y="326" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">the Tenstorrent backend for vLLM — where the decode defect lived</text><text x="74" y="345" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· platform.py</text><text x="74" y="362" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· model_runner.py  (sample_tokens)</text><text x="74" y="379" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· scheduler.py</text><text x="74" y="396" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· device state slots</text><rect x="40" y="408" width="900" height="112" rx="6" fill="#F6BC42" fill-opacity="0.1" stroke="#F6BC42" stroke-width="1.5"/><rect x="40" y="408" width="7" height="112" rx="3" fill="#F6BC42"/><text x="62" y="430" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">OUR CODE</text><text x="62" y="447" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">everything this project adds, training and serving</text><text x="74" y="466" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· bundle/tt_tnt_adapter.py — find_grid shim · weight-cache fingerprint · plugin-freshness guard</text><text x="74" y="483" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· kernels/*.cpp — gumbel · argmax-with-index · per-core reduce · tile_writer</text><text x="74" y="500" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· artifacts/token_core_map.npz — 32k tokens placed on the 11×10 die</text><text x="74" y="517" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· train/model.py · train/checkpoint.py — null-mask path · DDP topology re-mark</text><rect x="40" y="529" width="900" height="78" rx="6" fill="#74C5DF" fill-opacity="0.1" stroke="#74C5DF" stroke-width="1.5"/><rect x="40" y="529" width="7" height="78" rx="3" fill="#74C5DF"/><text x="62" y="551" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">tt_transformers   (inference)          ttml / tt-train   (training)</text><text x="62" y="568" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">the two model implementations — different code, same weights</text><text x="74" y="587" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· Attention · MLP · LMHead · KV cache · paged attention · Generator</text><text x="74" y="604" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· Llama model · AdamW · 4-chip DDP · stochastic rounding</text><rect x="40" y="616" width="900" height="78" rx="6" fill="#1B8EB1" fill-opacity="0.1" stroke="#1B8EB1" stroke-width="1.5"/><rect x="40" y="616" width="7" height="78" rx="3" fill="#1B8EB1"/><text x="62" y="638" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">TTNN</text><text x="62" y="655" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">the op layer we reach for directly when writing kernels</text><text x="74" y="674" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· matmul · SDPA · reduce · topk · rand_tile</text><text x="74" y="691" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· generic_op · KernelDescriptor · CBs · TensorAccessor</text><rect x="40" y="703" width="900" height="61" rx="6" fill="#14453f" fill-opacity="0.1" stroke="#14453f" stroke-width="1.5"/><rect x="40" y="703" width="7" height="61" rx="3" fill="#14453f"/><text x="62" y="725" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">tt-metal</text><text x="62" y="742" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">kernels, dispatch, and the JIT that builds them</text><text x="74" y="761" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· LLK · circular buffers · NoC transactions · JIT kernel build</text><rect x="40" y="773" width="900" height="78" rx="6" fill="#092221" fill-opacity="0.1" stroke="#092221" stroke-width="1.5"/><rect x="40" y="773" width="7" height="78" rx="3" fill="#092221"/><text x="62" y="795" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14.5" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">Blackhole p300c</text><text x="62" y="812" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">the silicon everything above is shaped around</text><text x="74" y="831" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· 11 × 10 = 110 usable Tensix (harvested from 17 × 12)</text><text x="74" y="848" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">· per-core L1 · NoC torus · SFPU (incl. the PRNG) · DRAM</text></svg>