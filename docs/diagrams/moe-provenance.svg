<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 946" width="1000" height="946" role="img" aria-label="where a Mixture of Enthusiasts comes from"><title>Mixture of Enthusiasts — provenance</title><desc>Training MoE comes from ttml (tt-train); inference MoE is a separate ttnn op. LlamaBlock.mlp is the seam that makes Llama plus MoE a subclass. Routing comes from the token-to-die map.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A5452"/></marker></defs><rect width="1000" height="946" fill="#F1F8F8"/><text x="40" y="46" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="26" fill="#092221" text-anchor="start" font-weight="600">a Mixture of Enthusiasts, and where each piece comes from</text><text x="40" y="70" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="13" fill="#3A5452" text-anchor="start" font-weight="400">enthusiasts, not experts — 123M parameters at one epoch buys enthusiasm about a corpus source</text><text x="40" y="118" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1B8EB1" text-anchor="start" font-weight="600">1 — TRAINING AND INFERENCE MoE ARE DIFFERENT CODEBASES</text><text x="40" y="138" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">the easiest mistake here; they share a name and nothing else</text><rect x="40" y="152" width="440" height="132" rx="6" fill="#74C5DF" fill-opacity="0.14" stroke="#1B8EB1" stroke-width="1"/><text x="58" y="176" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1B8EB1" text-anchor="start" font-weight="600">TRAINING</text><text x="58" y="198" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600">ttml  (tt-train)</text><text x="58" y="218" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">models/deepseek/moe_sparse_ep.py</text><text x="58" y="236" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">class SparseMoEEP(MoE)</text><text x="58" y="258" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11" fill="#3A5452" text-anchor="start" font-weight="400">trainable · autograd · 13 tests pass on 2 chips</text><text x="58" y="274" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11" fill="#3A5452" text-anchor="start" font-weight="400">arrived in tt-metal v0.77.0 (#43508)</text><rect x="520" y="152" width="440" height="132" rx="6" fill="#F6BC42" fill-opacity="0.14" stroke="#F6BC42" stroke-width="1"/><text x="538" y="176" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8A6A12" text-anchor="start" font-weight="600">INFERENCE</text><text x="538" y="198" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#092221" text-anchor="start" font-weight="600">ttnn.experimental.moe_compute</text><text x="538" y="218" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#3A5452" text-anchor="start" font-weight="400">operations/experimental/ccl/moe_compute/</text><text x="538" y="236" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#3A5452" text-anchor="start" font-weight="400">moe_core_placement.cpp — tilize/matmul/combine cores</text><text x="538" y="258" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11" fill="#3A5452" text-anchor="start" font-weight="400">fused · 35 tests pass single-card Blackhole</text><text x="538" y="274" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11" fill="#3A5452" text-anchor="start" font-weight="400">1×1 compute_only path — no CCL, no fabric</text><text x="500" y="350" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#FA512E" text-anchor="middle" font-weight="400">no shared code</text><path d="M500,296 L500,336" stroke="#FA512E" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/><text x="40" y="380" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#1B8EB1" text-anchor="start" font-weight="600">2 — THE SEAM: Llama + MoE IS A SUBCLASS, NOT AN ARCHITECTURE CHANGE</text><text x="40" y="400" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">tt-tnt keeps GQA, RoPE, its tokenizer and its die map; only the FFN slot changes</text><rect x="40" y="416" width="420" height="108" rx="6" fill="#F1F8F8" fill-opacity="1.0" stroke="#C7D9D8" stroke-width="1"/><text x="58" y="438" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#3A5452" text-anchor="start" font-weight="400">ttml/models/llama/transformer.py:177</text><text x="58" y="460" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#092221" text-anchor="start" font-weight="600">class LlamaBlock:</text><text x="74" y="480" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#092221" text-anchor="start" font-weight="400">self.mlp = LlamaMLP(...)</text><text x="58" y="506" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1B8EB1" text-anchor="start" font-weight="400">LlamaMLP.forward(Tensor) -&gt; Tensor</text><rect x="540" y="416" width="420" height="108" rx="6" fill="#74C5DF" fill-opacity="0.1" stroke="#1B8EB1" stroke-width="1"/><text x="558" y="438" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#3A5452" text-anchor="start" font-weight="400">our subclass — roughly twenty lines</text><text x="558" y="460" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#092221" text-anchor="start" font-weight="600">class EnthusiastBlock(LlamaBlock):</text><text x="574" y="480" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#092221" text-anchor="start" font-weight="400">self.mlp = SparseMoEEP(...)</text><text x="558" y="506" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#1B8EB1" text-anchor="start" font-weight="400">SparseMoEEP.forward(Tensor) -&gt; Tensor</text><path d="M462,472 L536,472" stroke="#3A5452" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="499" y="462" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10" fill="#3A5452" text-anchor="middle" font-weight="400">same</text><text x="499" y="540" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="11" fill="#3A5452" text-anchor="middle" font-weight="400">identical signature is the whole argument</text><text x="40" y="580" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#8A6FB0" text-anchor="start" font-weight="600">3 — THE ROUTING IS OURS: A TOKEN GOES WHERE IT LIVES</text><text x="40" y="600" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">not a learned gate — an address on the harvested 11×10 grid</text><rect x="40" y="616" width="208" height="76" rx="6" fill="#8A6FB0" fill-opacity="0.1" stroke="#8A6FB0" stroke-width="1"/><text x="54" y="642" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600">token id</text><text x="54" y="664" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="10.5" fill="#3A5452" text-anchor="start" font-weight="400">e.g. 4,812</text><path d="M250,654 L262,654" stroke="#8A6FB0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="264" y="616" width="208" height="76" rx="6" fill="#8A6FB0" fill-opacity="0.1" stroke="#8A6FB0" stroke-width="1"/><text x="278" y="642" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600">cell</text><text x="278" y="664" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="10.5" fill="#3A5452" text-anchor="start" font-weight="400">token_core_map.npz</text><path d="M474,654 L486,654" stroke="#8A6FB0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="488" y="616" width="208" height="76" rx="6" fill="#8A6FB0" fill-opacity="0.1" stroke="#8A6FB0" stroke-width="1"/><text x="502" y="642" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600">region</text><text x="502" y="664" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="10.5" fill="#3A5452" text-anchor="start" font-weight="400">Voronoi by measured centroid</text><path d="M698,654 L710,654" stroke="#8A6FB0" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="712" y="616" width="208" height="76" rx="6" fill="#8A6FB0" fill-opacity="0.1" stroke="#8A6FB0" stroke-width="1"/><text x="726" y="642" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600">enthusiast</text><text x="726" y="664" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="10.5" fill="#3A5452" text-anchor="start" font-weight="400">the expert that owns it</text><text x="40" y="720" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">measured, not asserted: source-characteristic tokens occupy distinct die regions —</text><text x="40" y="738" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">cell purity 0.546 against a 0.231 permutation floor, and steering to a region raises that</text><text x="40" y="756" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">region's register across four generation seeds (p &lt; 0.004 each).</text><text x="40" y="800" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#FA512E" text-anchor="start" font-weight="600">4 — THE GAP THIS BOX SITS IN</text><rect x="40" y="816" width="920" height="108" rx="6" fill="#FA512E" fill-opacity="0.07" stroke="#FA512E" stroke-width="1"/><text x="58" y="842" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="13" fill="#092221" text-anchor="start" font-weight="400">upstream ships MoE configs for single-card and for 6U Galaxy (32 chips). Nothing for four.</text><text x="58" y="866" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">tt-tnt already vendors a [1, 4] mesh-graph descriptor because ttml ships defaults for 8 and 32 only</text><text x="58" y="884" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400">— a mismatch there does not error, it HANGS in the first gradient all-reduce (train/run.py).</text><text x="58" y="908" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12.5" fill="#092221" text-anchor="start" font-weight="600">A QuietBox-2-native MoE training path does not exist yet. That is the opening.</text></svg>