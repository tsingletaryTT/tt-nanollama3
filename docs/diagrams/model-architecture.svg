<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1080" width="880" height="1080" role="img" aria-label="tt-tnt-1024 model architecture"><title>tt-tnt-1024 model architecture</title><rect width="880" height="1080" fill="#F1F8F8"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3A5452"/></marker></defs><text x="40" y="46" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="26" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">tt-tnt-1024</text><text x="40" y="70" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">122,962,944 parameters  ·  8 blocks  ·  d_model 1024  ·  512 context  ·  bfloat16</text><rect x="40" y="100" width="800" height="44" rx="4" fill="#1B8EB1" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="56" y="122" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">tokens  [B, T]</text><text x="56" y="140" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">T ≤ 512</text><rect x="40" y="154" width="800" height="52" rx="4" fill="#1B8EB1" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="56" y="176" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">embed_tokens</text><text x="56" y="194" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">32,000 × 1024  ·  tied with the LM head (tie_word_embeddings: true)</text><rect x="30" y="212" width="820" height="466" rx="8" fill="#6FABA0" fill-opacity="0.07" stroke="#6FABA0" stroke-width="1"/><text x="828" y="234" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" fill="#6FABA0" text-anchor="end" font-weight="600" letter-spacing="0">× 8</text><rect x="58" y="230" width="764" height="50" rx="4" fill="#6FABA0" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="74" y="252" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">RMSNorm</text><text x="74" y="270" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">eps 1e-05  ·  gamma learns only with stochastic rounding on</text><rect x="58" y="290" width="764" height="50" rx="4" fill="#6FABA0" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="74" y="312" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">Q / K / V projection</text><text x="74" y="330" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">16 query heads × 64  ·  4 KV heads × 64  ·  GQA 4:1</text><rect x="58" y="350" width="764" height="50" rx="4" fill="#6FABA0" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="74" y="372" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">RoPE</text><text x="74" y="390" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">theta 500,000  ·  applied to Q and K</text><rect x="58" y="410" width="764" height="50" rx="4" fill="#6FABA0" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="74" y="432" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">scaled dot-product attention</text><text x="74" y="450" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">causal  ·  mask passed as null so the kernel picks Causal, not Arbitrary (1.41×)</text><rect x="58" y="470" width="764" height="38" rx="4" fill="#6FABA0" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="74" y="492" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">+ residual</text><rect x="58" y="518" width="764" height="44" rx="4" fill="#6FABA0" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="74" y="540" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">RMSNorm</text><text x="74" y="558" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">eps 1e-05</text><rect x="58" y="572" width="764" height="50" rx="4" fill="#6FABA0" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="74" y="594" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">SwiGLU MLP</text><text x="74" y="612" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">gate 1024→2816  ·  up 1024→2816  ·  SiLU  ·  down 2816→1024</text><rect x="58" y="632" width="764" height="50" rx="4" fill="#6FABA0" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="74" y="654" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">+ residual</text><text x="74" y="672" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">2816 = 88 tiles = 8 × 11, which tiles the harvested 11-wide grid</text><rect x="40" y="694" width="800" height="40" rx="4" fill="#1B8EB1" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="56" y="716" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">final RMSNorm</text><rect x="40" y="744" width="800" height="52" rx="4" fill="#1B8EB1" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="56" y="766" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">lm_head</text><text x="56" y="784" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">1024 → 32,000  ·  weights tied to embed_tokens</text><rect x="40" y="806" width="800" height="52" rx="4" fill="#F6BC42" fill-opacity="0.16" stroke="#C7D9D8" stroke-width="1"/><text x="56" y="828" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" fill="#092221" text-anchor="start" font-weight="600" letter-spacing="0">sampling</text><text x="56" y="846" font-family="'Helvetica Neue',Inter,system-ui,sans-serif" font-size="12" fill="#3A5452" text-anchor="start" font-weight="400" letter-spacing="0">top-k / greedy on the standard path — or the topological sampler</text></svg>