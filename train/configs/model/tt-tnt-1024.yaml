#
# tt-tnt-1024 — the multi-chip-capable size.
#
# WHY THIS EXISTS. The 384 model cannot be served on more than one chip:
# `tt_transformers` asserts `n_heads % cluster_shape[1] == 0` AND
# `n_kv_heads % cluster_shape[1] == 0` (models/tt_transformers/tt/model_config.py:687-691),
# and `num_groups: 3` admits only mesh widths {1, 3}. That single choice — made to match
# tt-train's shipped example, before anyone measured its consequence — put every multi-chip
# code path in tt-kernel and the vLLM plugin permanently out of reach for this project.
#
# This size is chosen so those paths become reachable:
#
#   num_groups: 4   -> servable mesh widths {1, 2, 4}: single chip, N300/P300, and a
#                      4-chip QuietBox 2 all satisfy the assertion pair.
#   embedding_dim   -> 1024 % (32 * 4) == 0, so the hidden dimension splits into whole
#                      tiles per chip under 4-way tensor parallelism.
#   num_heads: 16   -> head_dim 64, matching the 384 model, so the RoPE/GQA conversion
#                      logic in convert/ is exercised unchanged rather than specially.
#
# GRID ARITHMETIC on Blackhole p300c (11x10 = 110 cores):
#
#   embedding_dim 1024 ->  32 tiles -> 4x8  =  32 cores (29% of the grid)
#   intermediate  2816 ->  88 tiles -> 8x11 =  88 cores (80% of the grid)
#
# The FFN number is the interesting one and the reason 1024 was preferred over larger
# candidates. The MLP holds most of the parameters and most of the matmul work, and its
# dimension is *derived* from embedding_dim by ttml
# (`modules/llama_block.cpp:15-24`: 8/3 of the embedding dim, rounded up to a multiple of
# 256) rather than chosen. At 1024 that derivation lands on 2816 = 88 tiles = 8x11, which
# fits this harvested grid exactly. dim=2560, despite better hidden-dimension utilisation
# (73%), derives an FFN of 6912 = 216 tiles whose best fit is only 72 cores (65%).
#
# FIRST TRAINED 2026-08-15 as tt-tnt-1024a (seed 5489, 10,764 steps, batch 64 x seq 512,
# artifacts/tokens-v3; artifacts/checkpoints-tt-tnt-1024a, converted to
# artifacts/hf-tt-tnt-1024a). 123.0M parameters, 2h42m on a single p300c at 903 s/1000
# steps — it auto-discovered as a (1,1) mesh, so the multi-chip path this shape was
# designed for is still unexercised by an actual training run.
#
# What it showed, and did not show. Final validation loss 2.928 against the 384 model's
# 2.939 — a 0.011-nat difference, far inside the 0.194 seed-only noise floor, i.e. 5.6x
# the parameters bought no measurable end-of-run loss. It did descend markedly faster
# early (-0.81 nats at step 1000), which is what the corpus-bound prediction below
# predicts: capacity buys early speed and then the data becomes the constraint. ct8's
# ~80M binding-constraint estimate is consistent with that and was NOT refuted.
# Where it did move something: the two register signals (tinystories margin, nearest-
# source share) moved 3.5x and 3.7x their seed-only noise floor on prompt set B — the
# first intervention in this project to move register beyond noise. That result is
# confounded: this run changed BOTH capacity (22M -> 123M) and context (2048 -> 512)
# relative to v3, so it cannot be attributed to capacity alone. See
# .superpowers/1024-first-run.md.
transformer_config:
  model_type: "llama"
  num_heads: 16
  num_groups: 4
  embedding_dim: 1024
  dropout_prob: 0.0
  num_blocks: 8
  vocab_size: 32000
  max_sequence_length: 512
  runner_type: default
  theta: 500000.0
