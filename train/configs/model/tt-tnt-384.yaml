#
# tt-tnt-384 — the architecture this project trained, converted, and published.
#
# PROVENANCE. Started as a verbatim copy of tt-train's own
# `tt-train/configs/model_configs/nanollama3.yaml` as of tt-metal
# rollback-pre-qwen36-1576-g620793d898, vendored here so that this repository OWNS the
# architectures it ships rather than resolving them out of $TT_METAL_HOME at runtime.
#
# DIVERGENCE FROM UPSTREAM (2026-08-13): `max_sequence_length` raised 256 -> 512 for the
# next training run, ahead of the nine-source/425M-token corpus rebuild -- that corpus
# contains long-form 19th-century naturalist prose that a 256-token window truncates
# badly. The already-trained-and-published v2 model (`docs/model-card.md`,
# `README.md`) used 256 and is unaffected; this value only takes effect on the NEXT run
# of `train/run.py`. See `.superpowers/seqlen-ddp-investigation.md` for why 512 is safe
# (no C++ ceiling on sequence length; the only hard constraint is
# `max_sequence_length % 32 == 0`), and `train/config.py`'s `build_yaml_config` for the
# invariant this value is paired with: `--seq-len` may not EXCEED this number. (That
# invariant was two-sided until 2026-08-16 -- `--seq-len` had to equal it exactly -- which
# is why the note above says "exactly". It is one-sided now; see the next paragraph.)
#
# RAISED AGAIN 512 -> 2048 (2026-08-14), and this time there is a measurement behind it
# rather than an expectation. A position-wise loss probe on the tt-tnt-v1 weights showed
# per-token loss flat from position ~64 to 511 -- on books as much as on short items -- so
# the trained model was extracting nothing from context beyond ~64 tokens and a longer
# window would have bought nothing. The cause was upstream of the window: the corpus
# carried NO document boundaries (see `scripts/prepare_corpus.py`), so distant context
# genuinely was unpredictable and the model correctly learned to ignore it. With `</s>`
# now marking every document, long context is worth having, which is what this value is
# for. 2048 is a multiple of 32 and flash-attention SDPA memory is linear in sequence
# length, so the same "no C++ ceiling" reasoning that cleared 512 covers it; what is NOT
# yet measured is the per-step time and activation memory at 4x the window, which is a
# throughput question for the run, not a correctness one.
#
# THIS VALUE IS THE MODEL'S DECLARED CONTEXT, NOT NECESSARILY THE TRAINED WINDOW
# (2026-08-16). `--seq-len` may now be set SHORTER than this, and the tt-tnt-384s512
# control run does exactly that: 384 trained at a 512 window against this 2048 declaration,
# so that it could be compared with the 1024 run (which trained at 512) at MATCHED context.
# This is safe and exact rather than approximate: in training, `ttml::ops::rope` hands the
# op the full 2048-row cos/sin cache, the reader kernel indexes it as `seq_tile * Wt` (a
# prefix read independent of the cache's declared length), and with no RoPE scaling
# configured here each position's cos/sin depends only on its own index -- so the first 512
# rows are bit-identical to a cache built at 512. See `train/config.py`'s `build_yaml_config`
# docstring for the full trace, including why the OPPOSITE direction is still rejected
# (tiles past the end of the cache are zero-filled on-device behind only a log_warning).
#
# WHY VENDOR IT. Until now `train/run.py` read this file from the tt-metal tree, which
# meant (a) the architecture could change underneath us on a tt-metal upgrade with no
# signal, and (b) there was no way to offer a second size, because there was only ever one
# file and it wasn't ours. Both are fixed by owning the file. See `train/sizes.py` for the
# registry that selects between architectures.
#
# DO NOT hand-edit the values below to make a new size. Add a new file and a new
# `ModelSize` entry in `train/sizes.py`, so the derived hardware facts (tile count, core
# grid, servable mesh widths) are computed for it and covered by tests.
#
# HARDWARE NOTES for this particular shape, measured on Blackhole p300c (compute grid
# 11x10 = 110 cores):
#
#   embedding_dim 384 -> 384/32 = 12 tiles -> best grid 2x6 = 12 cores = 11% utilisation.
#     Only 12 tiles exist, so no sharding strategy over the hidden dimension can fill the
#     grid; parallelism for a model this narrow has to come from sequence and batch.
#
#   num_groups 3 -> servable only on mesh widths that divide 3, i.e. {1, 3}. A 2-chip
#     (N300/P300) or 8-chip (T3K) mesh fails `n_kv_heads % cluster_shape[1] == 0` in
#     tt_transformers (`model_config.py:687-691`). This model is single-chip in practice.
#     Future sizes should pick num_groups divisible by the target mesh width.
#
#   384 % 128 != 0, so it cannot be tensor-parallelised across 4 chips with whole tiles
#     per chip either.
#
# These are recorded as facts about this shape, not as defects — it was chosen to match
# tt-train's shipped example, before any of the above was measured.
transformer_config:
  model_type: "llama"
  num_heads: 6
  num_groups: 3
  embedding_dim: 384
  dropout_prob: 0.0
  num_blocks: 6
  vocab_size: 32000
  max_sequence_length: 2048
  runner_type: default
  theta: 500000.0
