[project]
name = "tt-tnt"
version = "0.1.0"
description = "TT-TNT — a Tenstorrent-first model, trained, packaged, and served on TT tooling"
requires-python = ">=3.10"
dependencies = [
    "tokenizers>=0.21",
    "transformers>=4.52",
    "huggingface_hub>=0.36",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The repo root, so `train`, `convert` and `scripts` import from a BARE CHECKOUT
# with nothing installed. Every local run had these on sys.path via an editable
# install of the project under its pre-rename name (tt-nanollama3), which meant
# local green said nothing about a fresh clone -- CI's first run failed on
# `ModuleNotFoundError: No module named 'convert'` while the same command passed
# here. Not `pip install -e .` in the workflow: this repo is not a library, and a
# contributor with a fresh clone should be able to run pytest.
pythonpath = ["."]

[tool.setuptools.packages.find]
# Discovery by pattern, not an explicit list: Task 1 ships only `train/`, and
# `convert/` arrives in Task 2. An explicit `packages = ["train", "convert"]` makes
# `pip install -e .` fail until Task 2 lands, and bare flat-layout auto-discovery
# fails the other way once it does ("Multiple top-level packages discovered in a
# flat-layout"). Include patterns match whatever exists, in both states.
include = ["train*", "convert*"]
