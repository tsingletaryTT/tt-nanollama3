[project]
name = "tt-nanollama3"
version = "0.1.0"
description = "NanoLlama3 — a Tenstorrent-first model, trained, packaged, and served on TT tooling"
requires-python = ">=3.10"
dependencies = [
    "tokenizers>=0.21",
    "transformers>=4.52",
    "huggingface_hub>=0.36",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
# Discovery by pattern, not an explicit list: Task 1 ships only `train/`, and
# `convert/` arrives in Task 2. An explicit `packages = ["train", "convert"]` makes
# `pip install -e .` fail until Task 2 lands, and bare flat-layout auto-discovery
# fails the other way once it does ("Multiple top-level packages discovered in a
# flat-layout"). Include patterns match whatever exists, in both states.
include = ["train*", "convert*"]
